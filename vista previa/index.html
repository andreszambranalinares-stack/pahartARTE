<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vista previa de pahartARTE</title><style>
*{box-sizing:border-box}body{margin:0;background:#FCFAF5;color:#012C4D;font:16px/1.5 'Segoe UI',Arial,sans-serif}main{max-width:1240px;margin:auto;padding:28px 24px}a{color:inherit}h1{margin:12px 0 20px;font-size:32px}label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:8px 12px;background:white;border:1px solid #E6E1D9;border-radius:8px;color:inherit}.controles{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}.medidas{font-size:14px;color:#647180}.galeria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.galeria.movil{grid-template-columns:repeat(3,minmax(0,1fr))}figure{margin:0;padding:12px;border:1px solid #E6E1D9;border-radius:12px;background:white}figure img{width:100%;display:block;border-radius:6px}figcaption{font-weight:600;margin:12px 0 2px}@media(max-width:720px){.galeria,.galeria.movil{grid-template-columns:1fr}main{padding:20px 16px}.galeria.movil figure{max-width:414px;width:100%;margin:auto}}
</style></head><body><main><a href="../index.html">← Volver a las plantillas</a><h1>Vista previa</h1><div class="controles"><label>Perfil <select id="vista"><option value="vista personal">Vista personal</option><option value="vista 3ra persona">Vista de otro usuario</option></select></label><label>Dispositivo <select id="dispositivo"><option value="vista pc">PC</option><option value="vista movil">Móvil</option></select></label></div><p class="medidas" aria-live="polite"></p><div class="galeria"></div></main><script>
const vistas=[['todos','Todos'],['vacia','Vacía'],['obras','Obras'],['subastas','Subastas'],['enventa','En venta']];
const perfil=document.getElementById('vista'),dispositivo=document.getElementById('dispositivo'),galeria=document.querySelector('.galeria');
function mostrar(){galeria.classList.toggle('movil',dispositivo.value==='vista movil');document.querySelector('.medidas').textContent=dispositivo.value==='vista pc'?'Todas las imágenes de PC: 1536 × 1024 píxeles.':'Todas las imágenes de móvil: 390 × 844 píxeles. Capturas del área visible; el contenido continúa al desplazarse.';galeria.innerHTML=vistas.map(([id,nombre])=>{const src=encodeURI(perfil.value+'/'+dispositivo.value+'/'+id+'.png');return `<figure><a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${nombre}, ${perfil.value}, ${dispositivo.value}"></a><figcaption>${nombre}</figcaption></figure>`;}).join('');}
perfil.addEventListener('change',mostrar);dispositivo.addEventListener('change',mostrar);mostrar();
</script></body></html>
